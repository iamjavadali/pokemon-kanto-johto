name: D0 Fix1 Build Diagnostic

on:
  push:
    branches:
      - 'prototype/v0.1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  diagnose-firered:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout triggering SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: prototype-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Run strict FireRed build and preserve log
        id: strict-build
        shell: bash
        run: |
          set -uo pipefail
          : > firered-build.log
          set +e
          make firered -k -j"$(nproc)" -O 2>&1 | tee firered-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: d0-fix1-firered-build-log-${{ github.sha }}
          path: firered-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve strict build result
        shell: bash
        run: |
          status='${{ steps.strict-build.outputs.status }}'
          if [[ "$status" != "0" ]]; then
            echo "Strict FireRed build failed with exit code $status." >&2
            exit "$status"
          fi
