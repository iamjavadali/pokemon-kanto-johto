name: Apply Stage 1A Foundation

on:
  push:
    branches:
      - prototype/v0.1
    paths:
      - .github/workflows/stage1a-foundation-apply.yml
      - .github/scripts/stage1a_foundation_apply.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prototype/v0.1

      - name: Apply guarded Stage 1A patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/stage1a_foundation_apply.py')
          source = path.read_text()

          # Normalize the unused-flag line whose upstream spacing is compact.
          source = source.replace(
              '#define FLAG_0x0B0                         0x0B0',
              '#define FLAG_0x0B0               0x0B0'
          )

          # The follower engine has two direct local `mon` bindings plus other
          # follower-specific lead-mon lookups. Make all of those use the same
          # Partner-aware resolver so graphics, actions, field moves, transform
          # behavior, and Poké Ball presentation cannot disagree.
          source = source.replace(
              "if text.count(old_action) != 1:",
              "if text.count(old_action) != 2:"
          )
          source = source.replace(
              "expected one follower action resolver",
              "expected two follower action resolvers"
          )
          source = source.replace(
              "text = text.replace(old_action, 'struct Pokemon *mon = GetPartnerAwareFollowingMon();', 1)",
              "text = text.replace(old_action, 'struct Pokemon *mon = GetPartnerAwareFollowingMon();', 2)"
          )
          follower_write = "write(path, text)\n\n# 5. Prevent Partner Pikachu"
          follower_extra = '''old_transform = 'mon = GetFirstLiveMon(), MOVE_TRANSFORM'
          if text.count(old_transform) != 1:
              raise SystemExit(f'event_object_movement.c: expected one follower transform resolver, found {text.count(old_transform)}')
          text = text.replace(old_transform, 'mon = GetPartnerAwareFollowingMon(), MOVE_TRANSFORM', 1)
          old_field_follower = 'struct Pokemon *follower = GetFirstLiveMon();'
          if text.count(old_field_follower) != 1:
              raise SystemExit(f'event_object_movement.c: expected one field follower resolver, found {text.count(old_field_follower)}')
          text = text.replace(old_field_follower, 'struct Pokemon *follower = GetPartnerAwareFollowingMon();', 1)
          write(path, text)

          # 5. Prevent Partner Pikachu'''
          if follower_write not in source:
              raise SystemExit('Stage 1A helper follower write marker drifted')
          source = source.replace(follower_write, follower_extra, 1)

          # Replace one quoting-fragile helper block before compiling/executing the
          # guarded patch. The replacement is behaviorally equivalent.
          start = source.index("msg_old = ")
          end = source.index("\n\n# Main input cases.", start)
          replacement = '''msg_match = re.search(r'^    \\[MSG_LAST_POKE\\].*$', text, flags=re.MULTILINE)
          if msg_match is None:
              raise SystemExit('pokemon_storage_system.c: MSG_LAST_POKE table entry drifted')
          partner_msg = '    [MSG_PARTNER_PIKACHU_STAYS] = {COMPOUND_STRING("PIKACHU refuses to leave your side."), MSG_VAR_NONE}'
          text = text.replace(msg_match.group(0), msg_match.group(0) + '\\n' + partner_msg, 1)'''
          source = source[:start] + replacement + source[end:]

          code = compile(source, str(path), 'exec')
          exec(code, {'__name__': '__main__', '__file__': str(path)})
          PY

      - name: Validate Stage 1A diff
        shell: bash
        run: |
          git diff --check
          echo 'Changed paths:'
          git diff --name-only
          grep -q 'SPECIES_PIKACHU_STARTER' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -q 'VAR_KANTO_JOHTO_CAMPAIGN' include/constants/vars_frlg.h
          grep -q 'PARTNER_PIKACHU_JOHTO_MIN_CHALLENGE_LEVEL 30' include/constants/kanto_johto.h

      - name: Commit and push Stage 1A
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- .github/workflows/stage1a-foundation-apply.yml .github/scripts/stage1a_foundation_apply.py

          git add -- \
            src/data/pokemon/species_info/gen_1_families.h \
            include/constants/vars_frlg.h \
            include/constants/flags_frlg.h \
            include/constants/kanto_johto.h \
            data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc \
            src/event_object_movement.c \
            src/pokemon_storage_system.c \
            data/scripts/day_care_frlg.inc \
            data/maps/FourIsland_PokemonDayCare_Frlg/scripts.inc \
            docs/projects/KANTO_JOHTO_MASTER_RULES.md

          git diff --cached --check
          git diff --cached --quiet && { echo 'No Stage 1A changes were staged.'; exit 1; }
          git status --short
          git commit -m "feat: establish partner Pikachu foundation"
          git push origin HEAD:prototype/v0.1
