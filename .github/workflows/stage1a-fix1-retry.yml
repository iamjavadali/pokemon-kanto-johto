name: Stage 1A Fix 1 Retry

on:
  push:
    branches:
      - 'prototype/v0.1'
    paths:
      - '.github/workflows/stage1a-fix1-retry.yml'

permissions:
  contents: write

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  stage1a-fix1-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: prototype/v0.1
          fetch-depth: 0

      - name: Apply Stage 1A Fix 1 and compile corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          workflow = Path('.github/workflows/stage1a-feedback-fix.yml').read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d > /tmp/apply-stage1a-fix1.py", workflow)
          if not match:
              raise SystemExit('Unable to locate Stage 1A Fix 1 embedded patch payload')
          Path('/tmp/apply-stage1a-fix1.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python3 /tmp/apply-stage1a-fix1.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/rtc.c')
          text = path.read_text()
          if '#include "event_data.h"' not in text:
              text = text.replace('#include "global.h"\n', '#include "global.h"\n#include "event_data.h"\n', 1)
          if '#include "constants/flags.h"' not in text:
              marker = '#include "fake_rtc.h"\n'
              if marker not in text:
                  raise SystemExit('Unable to locate rtc.c include insertion point')
              text = text.replace(marker, marker + '#include "constants/flags.h"\n', 1)
          path.write_text(text)

          flags = Path('include/constants/flags.h')
          ftext = flags.read_text()
          if 'FLAG_GOT_TRAINER_WATCH' not in ftext:
              old = '#define FLAG_UNUSED_0x493                                           0x493 // Unused Flag'
              new = '#define FLAG_GOT_TRAINER_WATCH                                      0x493 // Mom gave the RTC-backed Trainer Watch'
              if old not in ftext:
                  raise SystemExit('FLAG_UNUSED_0x493 is no longer available')
              ftext = ftext.replace(old, new, 1)
          if 'FLAG_TRAINER_WATCH_TIME_VALID' not in ftext:
              old = '#define FLAG_UNUSED_0x494                                           0x494 // Unused Flag'
              new = '#define FLAG_TRAINER_WATCH_TIME_VALID                               0x494 // Saved fallback clock state is initialized'
              if old not in ftext:
                  raise SystemExit('FLAG_UNUSED_0x494 is no longer available')
              ftext = ftext.replace(old, new, 1)
          flags.write_text(ftext)

          frlg = Path('include/constants/flags_frlg.h')
          ft = frlg.read_text()
          if 'FLAG_GOT_TRAINER_WATCH' not in ft:
              old = '#define FLAG_0x0B1               0x0B1'
              new = '#define FLAG_GOT_TRAINER_WATCH                 0x0B1 // Mom gave the RTC-backed Trainer Watch'
              if old not in ft:
                  raise SystemExit('FRLG flag 0x0B1 is no longer available')
              ft = ft.replace(old, new, 1)
          if 'FLAG_TRAINER_WATCH_TIME_VALID' not in ft:
              old = '#define FLAG_0x0B2               0x0B2'
              new = '#define FLAG_TRAINER_WATCH_TIME_VALID          0x0B2 // Saved fallback clock state is initialized'
              if old not in ft:
                  raise SystemExit('FRLG flag 0x0B2 is no longer available')
              ft = ft.replace(old, new, 1)
          frlg.write_text(ft)

          watch = Path('src/trainer_watch.c')
          wt = watch.read_text()
          wt = wt.replace('\\\\n', '\\n')
          if '#include "menu.h"' not in wt:
              wt = wt.replace('#include "main.h"\n', '#include "main.h"\n#include "menu.h"\n', 1)
          if '#include "sprite.h"' not in wt:
              wt = wt.replace('#include "scanline_effect.h"\n', '#include "scanline_effect.h"\n#include "sprite.h"\n', 1)
          if '\\\\n' in wt:
              raise SystemExit('trainer_watch.c still contains doubled newline escapes')
          watch.write_text(wt)

          mom = Path('data/maps/PalletTown_PlayersHouse_1F_Frlg/scripts.inc')
          mt = mom.read_text()
          mt = mt.replace('\\t.string', '\t.string')
          mt = mt.replace('\\\\n', '\\n')
          mt = mt.replace('\\\\p', '\\p')
          mt = mt.replace('\\\\l', '\\l')
          if '\\t.string' in mt or '\\\\n' in mt or '\\\\p' in mt or '\\\\l' in mt:
              raise SystemExit('Mom Trainer Watch script still contains escaped source syntax')
          mom.write_text(mt)
          PY
          git diff --check
          git diff --stat

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build FireRed
        shell: bash
        run: |
          set -o pipefail
          make firered -j$(nproc) -O 2>&1 | tee stage1a-fix1-build.log

      - name: Verify ROM
        shell: bash
        run: |
          test -f pokefirered.gba
          test "$(stat -c%s pokefirered.gba)" -eq 33554432
          sha256sum pokefirered.gba | tee pokefirered.sha256

      - name: Commit validated Stage 1A Fix 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage1a-feedback-fix.yml
          git rm .github/workflows/stage1a-fix1-retry.yml
          git rm .github/workflows/stage1a-source-inspect.yml
          git add -- \
            include/global.h \
            include/constants/flags.h \
            include/constants/flags_frlg.h \
            include/rtc.h \
            include/trainer_watch.h \
            src/rtc.c \
            src/play_time.c \
            src/trainer_watch.c \
            src/reshow_battle_screen.c \
            src/battle_controller_oak_old_man.c \
            src/event_object_movement.c \
            data/specials.inc \
            data/maps/PalletTown_PlayersHouse_1F_Frlg/scripts.inc \
            data/maps/PalletTown_Frlg/scripts.inc \
            data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          git diff --cached --check
          git status --short
          git commit -m "fix: complete Stage 1A opening and Trainer Watch fallback"
          git push origin HEAD:prototype/v0.1
          git rev-parse HEAD | tee stage1a-fix1-commit.txt

      - name: Upload playable Stage 1A Fix 1 ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-kanto-johto-stage1a-fix1-${{ github.run_id }}
          path: |
            pokefirered.gba
            pokefirered.sha256
            stage1a-fix1-commit.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-fix1-retry-failure-${{ github.run_id }}
          path: |
            stage1a-fix1-build.log
          if-no-files-found: ignore
          retention-days: 1
