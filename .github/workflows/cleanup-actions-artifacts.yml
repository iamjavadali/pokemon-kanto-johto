name: Cleanup Actions Artifacts

on:
  push:
    branches:
      - 'prototype/v0.1'
    paths:
      - '.github/workflows/cleanup-actions-artifacts.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete all existing Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifact_ids < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          echo "Found ${#artifact_ids[@]} artifact(s)."
          for artifact_id in "${artifact_ids[@]}"; do
            echo "Deleting artifact ${artifact_id}"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
          remaining=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq '.total_count')
          echo "Remaining artifacts: ${remaining}"
          test "${remaining}" = "0"
