name: Diagnose Step 1 FireRed

on:
  push:
    branches:
      - 'prototype/v0.1'
    paths:
      - '.github/workflows/diagnose-step1-firered.yml'

permissions:
  contents: read

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  diagnose-firered:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: prototype-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Capture FireRed build log
        shell: bash
        run: |
          set +e
          make firered -j$(nproc) -O > firered-build.log 2>&1
          status=$?
          echo "BUILD_EXIT_CODE=$status" | tee -a firered-build.log
          exit 0

      - name: Upload compiler diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: step1-firered-build-log-${{ github.sha }}
          path: firered-build.log
          if-no-files-found: error
          retention-days: 7
