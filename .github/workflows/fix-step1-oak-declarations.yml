name: Fix Step 1 Oak Declarations

on:
  push:
    branches:
      - 'prototype/v0.1'
    paths:
      - '.github/workflows/fix-step1-oak-declarations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add guarded forward declarations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/oak_speech.c')
          text = path.read_text()
          needle = 'static void Task_OakSpeech_FadeOutForPlayerNamingScreen(u8);\n'
          declarations = (
              'static void Task_OakSpeech_FadeOutForPlayerNamingScreen(u8);\n'
              'static void Task_OakSpeech_MoveRivalDisplayNameOptions(u8);\n'
              'static void Task_OakSpeech_RepeatNameQuestion(u8);\n'
          )

          if 'static void Task_OakSpeech_MoveRivalDisplayNameOptions(u8);' in text[:12000]:
              raise SystemExit('Forward declaration already present; refusing duplicate patch.')
          if text.count(needle) != 1:
              raise SystemExit(f'Expected exactly one declaration anchor, found {text.count(needle)}.')
          if 'gTasks[taskId].func = Task_OakSpeech_MoveRivalDisplayNameOptions;' not in text:
              raise SystemExit('Expected Step 1 naming call is missing; refusing to patch unexpected source.')

          text = text.replace(needle, declarations, 1)
          path.write_text(text)
          PY

      - name: Verify minimal diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/oak_speech.c
          additions=$(git diff --numstat -- src/oak_speech.c | awk '{print $1}')
          deletions=$(git diff --numstat -- src/oak_speech.c | awk '{print $2}')
          test "$additions" = "2"
          test "$deletions" = "0"

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "Javad"
          git config user.email "38925895+iamjavadali@users.noreply.github.com"
          git add src/oak_speech.c
          git commit -m "fix: declare Step 1 Oak naming tasks"
          git push origin HEAD:prototype/v0.1
