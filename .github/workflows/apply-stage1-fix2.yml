name: Apply Stage 1 Fix 2

on:
  push:
    branches:
      - 'prototype/v0.1'
    paths:
      - '.github/workflows/apply-stage1-fix2.yml'
      - '.github/workflows/apply-stage1-fix2.py'

permissions:
  contents: write
  actions: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply guarded Stage 1 Fix 2
        run: python3 .github/workflows/apply-stage1-fix2.py

      - name: Verify gameplay diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          data/maps/PalletTown_Frlg/map.json
          data/maps/PalletTown_Frlg/scripts.inc
          data/specials.inc
          include/constants/battle.h
          src/battle_controller_oak_old_man.c
          src/battle_setup.c
          src/data/pokemon/species_info/gen_1_families.h
          src/oak_speech.c
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check

      - name: Commit Stage 1 Fix 2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/maps/PalletTown_Frlg/map.json \
            data/maps/PalletTown_Frlg/scripts.inc \
            data/specials.inc \
            include/constants/battle.h \
            src/battle_controller_oak_old_man.c \
            src/battle_setup.c \
            src/data/pokemon/species_info/gen_1_families.h \
            src/oak_speech.c
          git commit -m "fix: align Stage 1 with canonical Yellow opening [skip ci]"
          git push origin HEAD:prototype/v0.1
          git rev-parse HEAD | tee stage1-fix2-build-sha.txt

      - name: Purge previous development artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' > /tmp/artifact-ids.txt
          while read -r artifact_id; do
            if [[ -n "$artifact_id" ]]; then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            fi
          done < /tmp/artifact-ids.txt

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: prototype-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Validate docs
        run: .github/docs_validate/inclusive_summary.py

      - name: Fast C preflight
        shell: bash
        run: |
          set -o pipefail
          make BUILD=firered -j$(nproc) -O \
            build/firered/src/oak_speech.o \
            build/firered/src/battle_setup.o \
            build/firered/src/battle_controller_oak_old_man.o \
            2>&1 | tee preflight.log

      - name: Build FireRed
        shell: bash
        run: |
          set -o pipefail
          make firered -j$(nproc) -O 2>&1 | tee firered-build.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-fix2-diagnostics
          path: |
            preflight.log
            firered-build.log
            stage1-fix2-build-sha.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify ROM
        shell: bash
        run: |
          set -euo pipefail
          test -f pokefirered.gba
          sha256sum pokefirered.gba | tee pokefirered.sha256
          cat stage1-fix2-build-sha.txt

      - name: Upload Stage 1 Fix 2 ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-kanto-johto-stage1-fix2
          path: |
            pokefirered.gba
            pokefirered.sha256
            stage1-fix2-build-sha.txt
          if-no-files-found: error
          retention-days: 1
