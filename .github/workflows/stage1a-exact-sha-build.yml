name: Stage1A Exact SHA Build

on:
  push:
    branches:
      - prototype/v0.1

permissions:
  contents: read

env:
  TARGET_SHA: c173598333c9c97a77494c864f71cae87aa9b1aa
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact gameplay commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact SHA
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git status --short

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build FireRed target
        run: make firered -j$(nproc) -O

      - name: Validate ROM artifact
        run: |
          set -euo pipefail
          ROM="$(find . -maxdepth 2 -type f -name '*.gba' -print | head -n 1)"
          test -n "$ROM"
          test -s "$ROM"
          mkdir -p build-artifact
          cp "$ROM" build-artifact/Pokemon-Golden-Yellow-Stage1A-Narrow-Fixes.gba
          sha256sum build-artifact/Pokemon-Golden-Yellow-Stage1A-Narrow-Fixes.gba | tee build-artifact/SHA256SUMS.txt
          wc -c build-artifact/Pokemon-Golden-Yellow-Stage1A-Narrow-Fixes.gba
          git rev-parse HEAD | tee build-artifact/BUILD_COMMIT.txt

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Golden-Yellow-Stage1A-Narrow-Fixes
          path: build-artifact/
          if-no-files-found: error
