name: Apply Canonical Yellow Opening

on:
  push:
    branches:
      - 'prototype/v0.1'
    paths:
      - '.github/workflows/apply-yellow-opening.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply guarded Yellow opening rewrite
        run: python3 .github/workflows/apply-yellow-opening.py

      - name: Verify patch diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit canonical Yellow opening
        run: |
          git config user.name "Javad"
          git config user.email "38925895+iamjavadali@users.noreply.github.com"
          git add -- include/constants/flags_frlg.h data/maps/PalletTown_Frlg/map.json data/maps/PalletTown_Frlg/scripts.inc data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc docs/projects/KANTO_JOHTO_MASTER_RULES.md
          git diff --cached --check
          git commit -m "feat: restore canonical Yellow starter sequence"
          echo "GAMEPLAY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:prototype/v0.1

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: prototype-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Validate docs
        run: .github/docs_validate/inclusive_summary.py

      - name: Build FireRed
        shell: bash
        run: |
          set -o pipefail
          make firered -j"$(nproc)" -O 2>&1 | tee firered-build.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-opening-build-diagnostics-${{ env.GAMEPLAY_SHA }}
          path: firered-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify ROM
        run: |
          test -f pokefirered.gba
          sha256sum pokefirered.gba | tee pokefirered.sha256
          ls -lh pokefirered.gba

      - name: Upload playable ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-kanto-johto-yellow-opening-${{ env.GAMEPLAY_SHA }}
          path: |
            pokefirered.gba
            pokefirered.sha256
          if-no-files-found: error
          retention-days: 1
