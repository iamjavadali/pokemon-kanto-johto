name: Prototype FireRed Development

on:
  push:
    branches:
      - 'prototype/**'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/build.yml'
      - '.github/workflows/prototype-firered.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  build-firered-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: prototype-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Fast preflight
        shell: bash
        run: |
          set -o pipefail
          : > preflight.log

          echo "== Documentation index validation ==" | tee -a preflight.log
          .github/docs_validate/inclusive_summary.py 2>&1 | tee -a preflight.log

          echo "== Fetch prototype comparison base ==" | tee -a preflight.log
          git fetch --no-tags --depth=1 origin master 2>&1 | tee -a preflight.log

          mapfile -t changed_c < <(git diff --name-only FETCH_HEAD HEAD -- ':(glob)src/*.c' ':(glob)src/**/*.c')

          if ((${#changed_c[@]} == 0)); then
            echo "No C source changes versus master; skipping targeted object compilation." | tee -a preflight.log
            exit 0
          fi

          targets=()
          for source in "${changed_c[@]}"; do
            target="build/firered/${source%.c}.o"
            targets+=("$target")
            echo "Preflight target: $source -> $target" | tee -a preflight.log
          done

          echo "== Targeted FireRed object compilation ==" | tee -a preflight.log
          make BUILD=firered -j$(nproc) -O "${targets[@]}" 2>&1 | tee -a preflight.log

      - name: Build FireRed target
        shell: bash
        run: |
          set -o pipefail
          make firered -j$(nproc) -O 2>&1 | tee firered-build.log

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firered-build-diagnostics-${{ github.sha }}
          path: |
            preflight.log
            firered-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify ROM output
        run: |
          test -f pokefirered.gba
          ls -lh pokefirered.gba
          sha256sum pokefirered.gba | tee pokefirered.sha256

      - name: Upload playable prototype ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-kanto-johto-firered-${{ github.sha }}
          path: |
            pokefirered.gba
            pokefirered.sha256
          if-no-files-found: error
          retention-days: 1
