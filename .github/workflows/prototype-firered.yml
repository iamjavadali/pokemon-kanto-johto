name: Prototype FireRed Development

on:
  push:
    branches:
      - 'prototype/**'

permissions:
  contents: write

jobs:
  assemble-golden-yellow-docs:
    if: ${{ github.event.head_commit.message == 'chore: trigger Golden Yellow docs assembly' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: prototype/v0.1
          fetch-depth: 0

      - name: Reconstruct and verify exact project docs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/golden-yellow-build

          cat .project_docs_staging/Master.part00 \
              .project_docs_staging/Master.part01 \
              .project_docs_staging/Master.part02 \
              .project_docs_staging/Master.part03 \
            | base64 -d | gzip -d > docs/golden-yellow-build/Pokemon_Golden_Yellow_Project_Master.md

          cat .project_docs_staging/HardRules.part00 \
              .project_docs_staging/HardRules.part01 \
              .project_docs_staging/HardRules.part02 \
            | base64 -d | gzip -d > docs/golden-yellow-build/Pokemon_Golden_Yellow_Hard_Rules.md

          cat .project_docs_staging/CurrentState.part00 \
              .project_docs_staging/CurrentState.part01 \
            | base64 -d | gzip -d > docs/golden-yellow-build/Pokemon_Golden_Yellow_Current_Project_State.md

          echo 'db65ba8c05a6a3557b23e630b62e515e925d3688ea2df2427f61ebbcb54c8553  docs/golden-yellow-build/Pokemon_Golden_Yellow_Project_Master.md' | sha256sum -c -
          echo 'ca1e4e440a9a0f35fdde1e539f1022afb4a0383348891752ac3280fb1e4379f5  docs/golden-yellow-build/Pokemon_Golden_Yellow_Hard_Rules.md' | sha256sum -c -
          echo '03cdd011d4d3ab1b679129d9fd0d8b9ae8de54b9b19ae342d9c5c069c14a8b17  docs/golden-yellow-build/Pokemon_Golden_Yellow_Current_Project_State.md' | sha256sum -c -

      - name: Restore workflow and commit clean documentation tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show 8708aab6fce45327b7204b3a75a8b1b52e2402b4:.github/workflows/prototype-firered.yml > .github/workflows/prototype-firered.yml
          git rm -r .project_docs_staging
          git rm .github/workflows/project-docs-assemble.yml
          git add .github/workflows/prototype-firered.yml docs/golden-yellow-build
          git commit -m 'docs: add Golden Yellow project documentation [skip ci]'
          git push origin HEAD:prototype/v0.1
