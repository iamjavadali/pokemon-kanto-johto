name: Stage 1A Yellow Lab Continuation Run

on:
  push:
    branches:
      - prototype/v0.1
    paths:
      - .github/workflows/stage1a-lab-continuation-run.yml

permissions:
  contents: write

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout prototype v0.1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prototype/v0.1

      - name: Verify continuation state
        shell: bash
        run: |
          set -euo pipefail
          base=16f47810b17e75121c1d8e1f930662f95748ff73
          test "$(git diff --name-only "$base" HEAD | sort)" = "$(printf '%s\n' \
            .github/workflows/stage1a-lab-continuation-run.yml \
            .github/workflows/stage1a-lab-continuation.yml \
            .github/workflows/stage1a_lab_patch.py | sort)"

      - name: Apply approved continuation patch
        run: python3 .github/workflows/stage1a_lab_patch.py

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            data/maps/PalletTown_Frlg/scripts.inc \
            data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc \
            data/maps/Route1_Frlg/scripts.inc | sort)"

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build FireRed
        shell: bash
        run: |
          set -o pipefail
          make firered -j$(nproc) -O 2>&1 | tee firered-build.log

      - name: Verify ROM
        shell: bash
        run: |
          set -euo pipefail
          test -f pokefirered.gba
          test "$(stat -c%s pokefirered.gba)" = "33554432"
          sha256sum pokefirered.gba | tee pokefirered.sha256

      - name: Commit and push validated continuation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage1a-lab-continuation-run.yml \
                 .github/workflows/stage1a-lab-continuation.yml \
                 .github/workflows/stage1a_lab_patch.py
          git add data/maps/Route1_Frlg/scripts.inc \
                  data/maps/PalletTown_Frlg/scripts.inc \
                  data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          git diff --cached --check
          git commit -m "fix: restore Yellow lab staging and dialogue"
          git push origin HEAD:prototype/v0.1
          git rev-parse HEAD | tee validated-commit.txt

      - name: Upload validated ROM
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-yellow-lab-continuation-${{ github.run_id }}
          path: |
            pokefirered.gba
            pokefirered.sha256
            validated-commit.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-yellow-lab-continuation-diagnostics-${{ github.run_id }}
          path: |
            firered-build.log
          if-no-files-found: ignore
          retention-days: 1
