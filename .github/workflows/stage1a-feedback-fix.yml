name: Stage 1A Fix 1 Build and Publish

on:
  push:
    branches:
      - 'prototype/v0.1'
    paths:
      - '.github/workflows/stage1a-feedback-fix.yml'

permissions:
  contents: write

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  stage1a-fix1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: prototype/v0.1
          fetch-depth: 0

      - name: Apply Stage 1A Fix 1
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply-stage1a-fix1.py
          python3 /tmp/apply-stage1a-fix1.py
          git diff --check
          git diff --stat

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build FireRed
        shell: bash
        run: |
          set -o pipefail
          make firered -j$(nproc) -O 2>&1 | tee stage1a-fix1-build.log

      - name: Verify ROM
        shell: bash
        run: |
          test -f pokefirered.gba
          test "$(stat -c%s pokefirered.gba)" -eq 33554432
          sha256sum pokefirered.gba | tee pokefirered.sha256

      - name: Commit validated Stage 1A Fix 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage1a-feedback-fix.yml
          git add -- \
            include/global.h \
            include/constants/flags.h \
            include/rtc.h \
            include/trainer_watch.h \
            src/rtc.c \
            src/play_time.c \
            src/trainer_watch.c \
            src/reshow_battle_screen.c \
            src/battle_controller_oak_old_man.c \
            src/event_object_movement.c \
            data/specials.inc \
            data/maps/PalletTown_PlayersHouse_1F_Frlg/scripts.inc \
            data/maps/PalletTown_Frlg/scripts.inc \
            data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          git diff --cached --check
          git status --short
          git commit -m "fix: complete Stage 1A opening and Trainer Watch fallback"
          git push origin HEAD:prototype/v0.1
          git rev-parse HEAD | tee stage1a-fix1-commit.txt

      - name: Upload playable Stage 1A Fix 1 ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-kanto-johto-stage1a-fix1-${{ github.run_id }}
          path: |
            pokefirered.gba
            pokefirered.sha256
            stage1a-fix1-commit.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-fix1-failure-${{ github.run_id }}
          path: |
            stage1a-fix1-build.log
          if-no-files-found: ignore
          retention-days: 1
