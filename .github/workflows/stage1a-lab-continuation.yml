name: Stage 1A Yellow Lab Continuation

on:
  push:
    branches:
      - prototype/v0.1
    paths:
      - .github/workflows/stage1a-lab-continuation.yml

permissions:
  contents: write

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout prototype v0.1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prototype/v0.1

      - name: Verify continuation baseline
        shell: bash
        run: |
          set -euo pipefail
          expected=16f47810b17e75121c1d8e1f930662f95748ff73
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/stage1a-lab-continuation.yml"

      - name: Apply approved Yellow lab and escort corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, desc):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{desc}: expected 1 exact match, found {count}")
              return text.replace(old, new, 1)

          def replace_section(text, start_label, next_label, body, desc):
              pattern = re.compile(
                  rf"(?ms)^{re.escape(start_label)}::\n.*?(?=^{re.escape(next_label)}::)"
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"{desc}: expected 1 section, found {len(matches)}")
              replacement = start_label + "::\n" + body.rstrip("\n") + "\n\n"
              return pattern.sub(lambda _: replacement, text, count=1)

          # 1) Route 1: continue walking from the actors' actual post-capture positions,
          # then perform a silent coordinate-preserving handoff to Pallet Town.
          route = Path("data/maps/Route1_Frlg/scripts.inc")
          text = route.read_text()
          pattern = re.compile(
              r"(?ms)^Route1_EventScript_YellowPikachuCapture::\n.*?(?=^Route1_Movement_OakEnterLeft::)"
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"Route 1 capture/escort block: expected 1 section, found {len(matches)}")
          new_block = r'''Route1_EventScript_YellowPikachuCapture::
	special StartYellowPikachuCaptureBattle
	waitstate
	lockall
	textcolor NPC_TEXT_COLOR_MALE
	msgbox PalletTown_Text_OakWhew
	msgbox PalletTown_Text_OakComeWithMeYellow
	closemessage
	delay 20
	goto_if_eq VAR_0x8008, 1, Route1_EventScript_YellowEscortWarpRight
	applymovement LOCALID_ROUTE1_YELLOW_OAK, Route1_Movement_OakDepartToPalletLeft
	applymovement LOCALID_PLAYER, Route1_Movement_PlayerDepartToPalletLeft
	waitmovement 0
	setflag FLAG_HIDE_OAK_IN_PALLET_TOWN
	removeobject LOCALID_ROUTE1_YELLOW_OAK
	setvar VAR_MAP_SCENE_PALLET_TOWN_OAK, 4
	warpsilent MAP_PALLET_TOWN, 12, 0
	waitstate
	end

Route1_EventScript_YellowEscortWarpRight:
	applymovement LOCALID_ROUTE1_YELLOW_OAK, Route1_Movement_OakMoveBelowPlayerRight
	waitmovement 0
	applymovement LOCALID_ROUTE1_YELLOW_OAK, Route1_Movement_OakDepartToPalletRight
	applymovement LOCALID_PLAYER, Route1_Movement_PlayerDepartToPalletRight
	waitmovement 0
	setflag FLAG_HIDE_OAK_IN_PALLET_TOWN
	removeobject LOCALID_ROUTE1_YELLOW_OAK
	setvar VAR_MAP_SCENE_PALLET_TOWN_OAK, 4
	warpsilent MAP_PALLET_TOWN, 13, 0
	waitstate
	end

Route1_Movement_OakDepartToPalletLeft:
	walk_down
	walk_down
	walk_down
	step_end

Route1_Movement_PlayerDepartToPalletLeft:
	walk_down
	walk_down
	walk_down
	step_end

Route1_Movement_OakMoveBelowPlayerRight:
	walk_down
	walk_right
	walk_in_place_faster_down
	step_end

Route1_Movement_OakDepartToPalletRight:
	walk_down
	walk_down
	step_end

Route1_Movement_PlayerDepartToPalletRight:
	walk_down
	walk_down
	step_end

'''
          text = pattern.sub(new_block, text, count=1)
          route.write_text(text)

          # 2) Pallet Town: preserve the south-facing handoff and start the existing
          # walk-to-lab choreography immediately instead of visibly restaging.
          pallet = Path("data/maps/PalletTown_Frlg/scripts.inc")
          text = pallet.read_text()
          pattern = re.compile(
              r"(?ms)^PalletTown_EventScript_YellowOakEscortToLab::\n.*?(?=^PalletTown_EventScript_YellowOakEnterLab::)"
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"Pallet escort setup: expected 1 section, found {len(matches)}")
          new_block = r'''PalletTown_EventScript_YellowOakEscortToLab:
	lockall
	setvar VAR_MAP_SCENE_PALLET_TOWN_OAK, 5
	textcolor NPC_TEXT_COLOR_MALE
	clearflag FLAG_HIDE_OAK_IN_PALLET_TOWN
	goto_if_eq VAR_0x8008, 1, PalletTown_EventScript_YellowOakEscortRight
	setobjectxyperm LOCALID_PALLET_PROF_OAK, 12, 1
	setobjectmovementtype LOCALID_PALLET_PROF_OAK, MOVEMENT_TYPE_FACE_DOWN
	addobject LOCALID_PALLET_PROF_OAK
	call PalletTown_EventScript_OakLeadPlayerToLabLeft
	goto PalletTown_EventScript_YellowOakEnterLab

PalletTown_EventScript_YellowOakEscortRight:
	setobjectxyperm LOCALID_PALLET_PROF_OAK, 13, 1
	setobjectmovementtype LOCALID_PALLET_PROF_OAK, MOVEMENT_TYPE_FACE_DOWN
	addobject LOCALID_PALLET_PROF_OAK
	call PalletTown_EventScript_OakLeadPlayerToLabRight

'''
          text = pattern.sub(new_block, text, count=1)
          pallet.write_text(text)

          # 3) Oak's Lab: restore the already-designed left-tile Partner reveal.
          lab = Path("data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc")
          text = lab.read_text()
          old = '''\tsetflag FLAG_BEAT_RIVAL_IN_OAKS_LAB
\tsetflag FLAG_PARTNER_PIKACHU_FOLLOWING
\tcallnative UpdateFollowingPokemon
\tcallnative RevealFollowingPokemonNow
\tdelay 16
'''
          new = '''\tsetflag FLAG_BEAT_RIVAL_IN_OAKS_LAB
\tsetflag FLAG_PARTNER_PIKACHU_FOLLOWING
\tcallnative UpdateFollowingPokemon
\tgetplayerxy VAR_0x8004, VAR_0x8005
\tsubvar VAR_0x8004, 1
\tsetobjectxy OBJ_EVENT_ID_NPC_FOLLOWER, VAR_0x8004, VAR_0x8005
\tturnobject OBJ_EVENT_ID_NPC_FOLLOWER, DIR_EAST
\tcallnative RevealFollowingPokemonNow
\tdelay 16
'''
          text = replace_once(text, old, new, "Partner Pikachu initial reveal")

          # 4) Yellow is the narrative authority. Keep FRLG presentation where useful,
          # but restore distinctive Yellow dialogue and characterization.
          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_RivalNoFairWhatAboutMe",
              "PalletTown_ProfessorOaksLab_Text_RivalGoChoosePlayer",
              '''\t.string "{RIVAL}: Hey! Gramps! What\\n"
\t.string "about me?$"''',
              "Rival what-about-me dialogue")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakRivalCameEarly",
              "PalletTown_ProfessorOaksLab_Text_OakTakeBallOnTable",
              '''\t.string "OAK: Hmm? {RIVAL}?\\n"
\t.string "Why are you here already?\\p"
\t.string "I said for you to come by later...\\p"
\t.string "Ah, whatever! Just wait there.$"''',
              "Oak rival-arrived-early dialogue")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakTakeBallOnTable",
              "PalletTown_ProfessorOaksLab_Text_OakBePatientYellow",
              '''\t.string "OAK: Look, {PLAYER}! Do you see that\\n"
\t.string "ball on the table?\\p"
\t.string "It's called a POKé BALL. It holds\\n"
\t.string "a POKéMON inside.\\p"
\t.string "You may have it! Go on, take it!$"''',
              "Oak Poké Ball explanation")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakBePatientYellow",
              "PalletTown_ProfessorOaksLab_Text_RivalWantsEevee",
              '''\t.string "OAK: Be patient, {RIVAL}.\\n"
\t.string "I'll give you one later.$"''',
              "Oak be-patient dialogue")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_RivalSnatchedEevee",
              "PalletTown_ProfessorOaksLab_Text_OakRivalWhatDoing",
              '''\t.string "{RIVAL} snatched the POKéMON!$"''',
              "Rival snatch narration")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakAllowsEevee",
              "PalletTown_ProfessorOaksLab_Text_OakGiveCaughtPikachu",
              '''\t.string "OAK: But, I... Oh, all right then.\\p"
\t.string "That POKéMON is yours.\\p"
\t.string "I was going to give you one\\n"
\t.string "anyway...\\p"
\t.string "{PLAYER}, come over here.$"''',
              "Oak allows Eevee dialogue")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakGiveCaughtPikachu",
              "PalletTown_ProfessorOaksLab_Text_OakPikachuCameOut",
              '''\t.string "OAK: {PLAYER}, this is the POKéMON I\\n"
\t.string "caught earlier.\\p"
\t.string "You can have it. I caught it in\\n"
\t.string "the wild, and it's not tame yet.$"''',
              "Oak gives caught Pikachu dialogue")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakPikachuCameOut",
              "PalletTown_ProfessorOaksLab_Text_OakPikachuDislikesBalls",
              '''\t.string "OAK: What?$"''',
              "Oak Pikachu escape reaction")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakPikachuDislikesBalls",
              "PalletTown_ProfessorOaksLab_Text_OakReadyForStarter",
              '''\t.string "OAK: Would you look at that!\\p"
\t.string "It's odd, but it appears that your\\n"
\t.string "PIKACHU dislikes POKé BALLS.\\p"
\t.string "You should just keep it with you.\\p"
\t.string "That should make it happy!\\p"
\t.string "You can talk to it and see how it\\n"
\t.string "feels about you.$"''',
              "Oak Partner Pikachu explanation")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakBattleMonForItToGrow",
              "PalletTown_ProfessorOaksLab_Text_OakHaveSomethingForMe",
              '''\t.string "OAK: You should talk to PIKACHU and\\n"
\t.string "see how it feels.$"''',
              "Oak post-opening Partner advice")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_RivalWhatDidYouCallMeFor",
              "PalletTown_ProfessorOaksLab_Text_RivalLeaveItToMeGramps",
              '''\t.string "{RIVAL}: Gramps, my POKéMON has\\n"
\t.string "grown stronger! Check it out!$"''',
              "Rival parcel-return boast")

          text = replace_section(text,
              "PalletTown_ProfessorOaksLab_Text_OakHaveRequestForYouTwo",
              "PalletTown_ProfessorOaksLab_Text_OakPokedexOnDesk",
              '''\t.string "OAK: Ah, {RIVAL}, good timing!\\p"
\t.string "I needed to ask both of you to do\\n"
\t.string "something for me.$"''',
              "Oak Pokédex request transition")

          lab.write_text(text)
          PY

          git diff --check
          echo "Changed files:"
          git diff --name-only
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            data/maps/PalletTown_Frlg/scripts.inc \
            data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc \
            data/maps/Route1_Frlg/scripts.inc | sort)"

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build FireRed
        shell: bash
        run: |
          set -o pipefail
          make firered -j$(nproc) -O 2>&1 | tee firered-build.log

      - name: Verify ROM
        shell: bash
        run: |
          test -f pokefirered.gba
          test "$(stat -c%s pokefirered.gba)" = "33554432"
          sha256sum pokefirered.gba | tee pokefirered.sha256

      - name: Commit and push validated continuation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage1a-lab-continuation.yml
          git add data/maps/Route1_Frlg/scripts.inc \
                  data/maps/PalletTown_Frlg/scripts.inc \
                  data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          git diff --cached --check
          git commit -m "fix: restore Yellow lab staging and dialogue"
          git push origin HEAD:prototype/v0.1
          git rev-parse HEAD | tee validated-commit.txt

      - name: Upload validated ROM
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-yellow-lab-continuation-${{ github.run_id }}
          path: |
            pokefirered.gba
            pokefirered.sha256
            validated-commit.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-yellow-lab-continuation-diagnostics-${{ github.run_id }}
          path: |
            firered-build.log
          if-no-files-found: ignore
          retention-days: 1
