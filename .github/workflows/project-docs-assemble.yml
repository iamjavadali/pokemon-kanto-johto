name: Assemble Golden Yellow Project Docs

on:
  push:
    branches:
      - prototype/v0.1

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.event.head_commit.message == 'chore: stage Golden Yellow project docs' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/v0.1
          fetch-depth: 0

      - name: Reconstruct exact project docs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project_docs

          cat .project_docs_staging/Master.part00 \
              .project_docs_staging/Master.part01 \
              .project_docs_staging/Master.part02 \
              .project_docs_staging/Master.part03 \
            | base64 -d | gzip -d > project_docs/Pokemon_Golden_Yellow_Project_Master.md

          cat .project_docs_staging/HardRules.part00 \
              .project_docs_staging/HardRules.part01 \
              .project_docs_staging/HardRules.part02 \
            | base64 -d | gzip -d > project_docs/Pokemon_Golden_Yellow_Hard_Rules.md

          cat .project_docs_staging/CurrentState.part00 \
              .project_docs_staging/CurrentState.part01 \
            | base64 -d | gzip -d > project_docs/Pokemon_Golden_Yellow_Current_Project_State.md

          echo 'db65ba8c05a6a3557b23e630b62e515e925d3688ea2df2427f61ebbcb54c8553  project_docs/Pokemon_Golden_Yellow_Project_Master.md' | sha256sum -c -
          echo 'ca1e4e440a9a0f35fdde1e539f1022afb4a0383348891752ac3280fb1e4379f5  project_docs/Pokemon_Golden_Yellow_Hard_Rules.md' | sha256sum -c -
          echo '03cdd011d4d3ab1b679129d9fd0d8b9ae8de54b9b19ae342d9c5c069c14a8b17  project_docs/Pokemon_Golden_Yellow_Current_Project_State.md' | sha256sum -c -

      - name: Commit project docs and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .project_docs_staging
          git rm .github/workflows/project-docs-assemble.yml
          git add project_docs
          git commit -m 'docs: add Golden Yellow project documentation'
          git push origin HEAD:prototype/v0.1
