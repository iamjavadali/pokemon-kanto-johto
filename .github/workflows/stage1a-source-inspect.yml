name: Stage 1A Fix 1 Source Inspect

on:
  push:
    branches:
      - 'prototype/v0.1'
    paths:
      - '.github/workflows/stage1a-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: prototype/v0.1
          fetch-depth: 1

      - name: Materialize Stage 1A Fix 1 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          workflow = Path('.github/workflows/stage1a-feedback-fix.yml').read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d > /tmp/apply-stage1a-fix1.py", workflow)
          if not match:
              raise SystemExit('Unable to locate Stage 1A Fix 1 embedded patch payload')
          Path('/tmp/apply-stage1a-fix1.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python3 /tmp/apply-stage1a-fix1.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/rtc.c')
          text = path.read_text()
          if '#include "event_data.h"' not in text:
              text = text.replace('#include "global.h"\n', '#include "global.h"\n#include "event_data.h"\n', 1)
          if '#include "constants/flags.h"' not in text:
              text = text.replace('#include "fake_rtc.h"\n', '#include "fake_rtc.h"\n#include "constants/flags.h"\n', 1)
          path.write_text(text)

          flags = Path('include/constants/flags.h')
          ftext = flags.read_text()
          if 'FLAG_GOT_TRAINER_WATCH' not in ftext:
              ftext = ftext.replace('#define FLAG_UNUSED_0x493                                           0x493 // Unused Flag', '#define FLAG_GOT_TRAINER_WATCH                                      0x493 // Mom gave the RTC-backed Trainer Watch', 1)
          if 'FLAG_TRAINER_WATCH_TIME_VALID' not in ftext:
              ftext = ftext.replace('#define FLAG_UNUSED_0x494                                           0x494 // Unused Flag', '#define FLAG_TRAINER_WATCH_TIME_VALID                               0x494 // Saved fallback clock state is initialized', 1)
          flags.write_text(ftext)

          frlg = Path('include/constants/flags_frlg.h')
          ft = frlg.read_text()
          if 'FLAG_GOT_TRAINER_WATCH' not in ft:
              ft = ft.replace('#define FLAG_0x0B1               0x0B1', '#define FLAG_GOT_TRAINER_WATCH                 0x0B1 // Mom gave the RTC-backed Trainer Watch', 1)
          if 'FLAG_TRAINER_WATCH_TIME_VALID' not in ft:
              ft = ft.replace('#define FLAG_0x0B2               0x0B2', '#define FLAG_TRAINER_WATCH_TIME_VALID          0x0B2 // Saved fallback clock state is initialized', 1)
          frlg.write_text(ft)
          PY
          git diff > stage1a-fix1-generated.diff

      - name: Upload generated source inspection
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-fix1-source-inspect-${{ github.run_id }}
          path: |
            src/trainer_watch.c
            src/rtc.c
            src/play_time.c
            src/reshow_battle_screen.c
            src/battle_controller_oak_old_man.c
            src/event_object_movement.c
            include/trainer_watch.h
            include/rtc.h
            include/constants/flags.h
            include/constants/flags_frlg.h
            data/maps/PalletTown_PlayersHouse_1F_Frlg/scripts.inc
            data/maps/PalletTown_Frlg/scripts.inc
            data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
            stage1a-fix1-generated.diff
          if-no-files-found: error
          retention-days: 1
